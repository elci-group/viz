[package]
name = "viz"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.74"
description = "Evidence-driven compiler for reproducible terminal demonstrations"
license = "MIT"
repository = "https://github.com/elci-group/viz"
readme = "README.md"
keywords = ["terminal", "demo", "vhs", "cli", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "viz"
path = "src/main.rs"

[lib]
name = "viz"
path = "src/lib.rs"

[dependencies]
form3 = { path = "../3form" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
